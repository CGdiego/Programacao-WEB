<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 03</title>
    <link rel="stylesheet" href="./estilos/index.css">
</head>
<body>
    <div class="bloco">
        <label id="lblId" class="lbl">Olá</label>

        <input id="inptNome" class="inpt" type="text" placeholder="Digite seu nome">
        <input id="inptSenha" class="inpt" type="password" placeholder="Digite sua senha">
        <button id="btnEnviar" class="btn">Enviar</button>
    </div>

    <div class="bloco">
        <h1>Calculadora</h1>

        <input id="inptN1" class="inpt" type="number" placeholder="Insira o 1º valor">
        <input id="inptN2" class="inpt" type="number" placeholder="Insira o 2º valor">
        <button id="btnNM" class="btn">Maior Valor</button>
        <div class="botoes"> 
            <button id="btnSom" class="btn">+</button>
            <button id="btnSub" class="btn">-</button>
            <button id="btnMul" class="btn">×</button>
            <button id="btnDiv" class="btn">÷</button>
        </div>
        <button id="btnLimpar" class="btn">Limpar</button>
    </div>

    <script src="./codigos/index.js" defer></script>
</body>
</html>
