<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <h1>Tabela de Alunos</h1>
    <div id="container">
        <input id="inptAluno" placeholder="Nome Aluno">
        <input id="inptIdade" type="number" placeholder="Idade">
        <input id="inptSenha" type="password" placeholder="Senha">
        <button id="btnEnviar">Enviar</button>
        <table>
            <thead>
                <tr>
                    <th>ID Aluno</th>
                    <th>Nome Aluno</th>
                </tr>
            </thead>
            <tbody id="tabelaCorpo">

            </tbody>
        </table>
    </div>

    <script src="./index.js" defer></script>
</body>
</html>
